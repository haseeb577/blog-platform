<div class="container mt-4">
  <h2>All Posts</h2>
<a routerLink="/posts/new" class="btn btn-success mb-3">Create New Post</a>


  <ag-grid-angular
  *ngIf="rowData?.length"
  class="ag-theme-alpine"
  [theme]="'legacy'"
  [rowData]="rowData"
   [pagination]="true"
  [paginationPageSize]="5"
  [columnDefs]="columnDefs"
  style="width: 100%; height: 310px">
</ag-grid-angular>


</div>
