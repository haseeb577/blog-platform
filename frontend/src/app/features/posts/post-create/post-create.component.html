<div class="container mt-4">
  <h2>Create New Post</h2>

  <form (ngSubmit)="createPost()" #postForm="ngForm" class="mt-3">
    <div class="mb-3">
      <label for="title" class="form-label">Title</label>
      <input
        type="text"
        id="title"
        name="title"
        [(ngModel)]="title"
        required
        class="form-control"
      />
    </div>

    <div class="mb-3">
      <label for="content" class="form-label">Content</label>
      <textarea
        id="content"
        name="content"
        [(ngModel)]="content"
        required
        rows="5"
        class="form-control"
      ></textarea>
    </div>

    <button type="submit" class="btn btn-success" [disabled]="!postForm.form.valid">Create</button>
  </form>
</div>
