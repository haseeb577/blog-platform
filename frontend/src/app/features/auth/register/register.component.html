<div class="container mt-5 d-flex justify-content-center align-items-center" style="min-height: 80vh;">
  <div class="card shadow p-4" style="width: 400px; border-radius: 12px;">
    <h2 class="text-center mb-4">Create an Account</h2>

    <form (ngSubmit)="onRegister()">
      <div class="form-group mb-3">
        <label>Email</label>
        <input type="email" [(ngModel)]="email" name="email" class="form-control" placeholder="Enter email" required>
      </div>

      <div class="form-group mb-4">
        <label>Password</label>
        <input type="password" [(ngModel)]="password" name="password" class="form-control" placeholder="Enter password" required>
      </div>

      <button type="submit" class="btn btn-success w-100 mb-2">Register</button>
    </form>

    <hr>

    <p class="text-center mb-2">Already have an account?</p>
    <button class="btn btn-outline-secondary w-100" (click)="goToLogin()">Back to Login</button>
  </div>
</div>
